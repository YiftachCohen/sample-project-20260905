name: Checks
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Revision
        required: true
      result:
        description: Result
        required: true
        default: success
permissions:
  contents: read
  checks: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record result
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ inputs.revision }}
          RESULT: ${{ inputs.result }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          revision = os.environ['REVISION']
          result = os.environ['RESULT']
          assert re.fullmatch(r'[0-9a-f]{40}', revision)
          assert result in ('success', 'failure')
          body = {'name': 'validation', 'head_sha': revision, 'status': 'completed', 'conclusion': result, 'output': {'title': 'Validation', 'summary': 'Completed.'}}
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/check-runs', json.dumps(body).encode(), headers={'Authorization': 'Bearer ' + os.environ['TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              print(response.status)
          PY
